<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auswander-Check | Tabula Rasa Life</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', system-ui, sans-serif;
      background: #f4f4f4;
      color: #111;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 16px 48px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.09);
      max-width: 640px;
      width: 100%;
      overflow: hidden;
    }

    /* Header */
    .hdr {
      background: #ff5f1f;
      padding: 28px 36px 24px;
      color: #fff;
    }
    .hdr-brand {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      opacity: .8;
      margin-bottom: 8px;
    }
    .hdr h1 {
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.25;
    }
    .hdr-sub {
      font-size: .82rem;
      opacity: .75;
      margin-top: 6px;
      font-weight: 500;
    }

    /* Progress */
    .progress-wrap {
      padding: 20px 36px 0;
    }
    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: .75rem;
      font-weight: 600;
      color: #888;
      margin-bottom: 8px;
    }
    .progress-track {
      height: 5px;
      background: #eee;
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #ff5f1f;
      border-radius: 3px;
      transition: width .4s ease;
    }

    /* Body */
    .body {
      padding: 28px 36px 36px;
    }

    /* Phase label */
    .phase-label {
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #ff5f1f;
      margin-bottom: 10px;
    }

    /* Question */
    .question {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 6px;
      color: #111;
    }
    .question-hint {
      font-size: .8rem;
      color: #888;
      margin-bottom: 20px;
      font-weight: 500;
    }

    /* Options */
    .options { display: flex; flex-direction: column; gap: 9px; margin-top: 18px; }

    .opt {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      border: 2px solid #e8e8e8;
      border-radius: 12px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      font-size: .88rem;
      font-weight: 500;
      color: #333;
      user-select: none;
    }
    .opt:hover { border-color: #ff5f1f; background: #fff8f5; }
    .opt.selected { border-color: #ff5f1f; background: #fff3ee; color: #111; }
    .opt-dot {
      width: 20px; height: 20px;
      border-radius: 50%;
      border: 2px solid #ccc;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: border-color .15s, background .15s;
    }
    .opt.selected .opt-dot { border-color: #ff5f1f; background: #ff5f1f; }
    .opt-dot::after {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #fff;
      display: none;
    }
    .opt.selected .opt-dot::after { display: block; }
    /* checkbox style for multi */
    .opt.multi .opt-dot { border-radius: 5px; }
    .opt.multi.selected .opt-dot::after {
      content: '✓';
      font-size: 11px;
      width: auto; height: auto;
      border-radius: 0;
      font-weight: 800;
    }

    /* Nav */
    .nav {
      display: flex;
      gap: 10px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #f0f0f0;
    }
    .btn {
      padding: 13px 24px;
      border-radius: 10px;
      font-family: inherit;
      font-size: .88rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary { background: #ff5f1f; color: #fff; flex: 1; }
    .btn-primary:hover { opacity: .9; }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
    .btn-back { background: #f0f0f0; color: #555; }
    .btn-back:hover { background: #e8e8e8; }

    /* Intro form */
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: .78rem; font-weight: 700; color: #555; margin-bottom: 6px; letter-spacing: .04em; text-transform: uppercase; }
    .field input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e8e8e8;
      border-radius: 10px;
      font-family: inherit;
      font-size: .9rem;
      font-weight: 500;
      color: #111;
      transition: border-color .15s;
      outline: none;
    }
    .field input:focus { border-color: #ff5f1f; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* Transition screen */
    .transition-box {
      background: #fff8f5;
      border: 2px solid #ffe0d0;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
    }
    .transition-box h2 { font-size: 1rem; font-weight: 800; margin-bottom: 8px; color: #111; }
    .transition-box p { font-size: .85rem; color: #555; line-height: 1.6; font-weight: 500; }
    .topic-count {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ff5f1f;
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: .82rem;
      font-weight: 700;
      margin-top: 14px;
    }

    /* Submitting */
    .submitting-wrap { text-align: center; padding: 20px 0; }
    .spinner {
      width: 52px; height: 52px;
      border: 4px solid #ffe0d0;
      border-top-color: #ff5f1f;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .submitting-wrap h2 { font-size: 1.1rem; font-weight: 800; margin-bottom: 8px; }
    .submitting-wrap p { font-size: .85rem; color: #777; font-weight: 500; }
    .status-steps { margin-top: 24px; text-align: left; }
    .status-step {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 0;
      font-size: .83rem; font-weight: 600;
      color: #bbb;
      border-bottom: 1px solid #f0f0f0;
      transition: color .3s;
    }
    .status-step.done { color: #22c55e; }
    .status-step.active { color: #ff5f1f; }
    .status-step .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

    /* Result */
    .result-icon { font-size: 3rem; text-align: center; margin-bottom: 12px; }
    .result-box { text-align: center; margin-bottom: 24px; }
    .result-box h2 { font-size: 1.3rem; font-weight: 800; margin-bottom: 8px; }
    .result-box p { font-size: .88rem; color: #555; font-weight: 500; line-height: 1.6; }
    .gamma-link-wrap {
      background: #f8f8f8;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 20px;
    }
    .gamma-link-label { font-size: .72rem; font-weight: 700; color: #888; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }
    .gamma-link {
      display: flex; align-items: center; gap: 10px;
      background: #fff;
      border: 2px solid #e8e8e8;
      border-radius: 9px;
      padding: 11px 14px;
      font-size: .82rem;
      font-weight: 600;
      color: #333;
      text-decoration: none;
      word-break: break-all;
      transition: border-color .15s;
    }
    .gamma-link:hover { border-color: #ff5f1f; }
    .email-confirm {
      display: flex; align-items: center; gap: 8px;
      font-size: .82rem; font-weight: 600; color: #22c55e;
      margin-top: 10px;
    }
    .btn-calendly {
      display: block; width: 100%;
      background: #111;
      color: #fff;
      padding: 15px 24px;
      border-radius: 12px;
      text-align: center;
      text-decoration: none;
      font-family: inherit;
      font-size: .92rem;
      font-weight: 700;
      transition: opacity .15s;
    }
    .btn-calendly:hover { opacity: .85; }
    .calendly-sub { font-size: .78rem; color: #888; text-align: center; margin-top: 8px; font-weight: 500; }

    /* Error */
    .error-box {
      background: #fff3f3;
      border: 2px solid #fca5a5;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .error-box h3 { font-size: .95rem; font-weight: 800; color: #dc2626; margin-bottom: 6px; }
    .error-box p { font-size: .83rem; color: #555; font-weight: 500; line-height: 1.6; }

    /* Resume banner */
    .resume-banner {
      background: #fff3ee;
      border: 2px solid #ffd0b5;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 20px;
      display: flex; align-items: center; gap: 12px;
    }
    .resume-banner p { font-size: .82rem; font-weight: 600; color: #333; flex: 1; }
    .btn-resume { background: #ff5f1f; color: #fff; padding: 8px 14px; border-radius: 8px; font-family: inherit; font-size: .78rem; font-weight: 700; border: none; cursor: pointer; white-space: nowrap; }

    @media (max-width: 480px) {
      .hdr, .body, .progress-wrap { padding-left: 22px; padding-right: 22px; }
      .field-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="card" id="app"></div>

<script>
// ============================================================
// CONFIG
// ============================================================
const CFG = {
  // Make/Zapier Webhook URL – hier eintragen nach Einrichtung:
  webhookUrl: 'https://hooks.zapier.com/hooks/catch/11104389/4opimsj/',
  trlEmail:   'beratung@tabula-rasa.life',
  calendly:   'https://calendly.com/tabula_rasa_life/60-minuten-auswander-beratung',
  // Gamma-Einstellungen (werden vom Webhook/Make verwendet):
  gammaThemeId: 'dialogue'
};

// ============================================================
// STATE
// ============================================================
let S = {
  vorname: '', nachname: '', email: '',
  f1:[], f2:[], f3:'', f4:'', f5:'',
  f6:[], f7:'', f8:'', f9:'', f10:'',
  f11:'', f12:'', f13:'', f14:'',
  f15:'', f16:'', f17:'',
  p2: {}  // keyed by topic id
};

let screen    = 'intro';   // intro|phase1|transition|phase2|submitting|result|error
let p1Step    = 0;         // 0-16
let p2Topics  = [];        // triggered topic ids
let p2Step    = 0;
let errorMsg  = '';
let statusStep = 0;        // 0-2 for submitting animation

// ============================================================
// PHASE 1 QUESTIONS
// ============================================================
const P1 = [
  { id:'f1', q:'Wer geht den Weg mit dir?', hint:'Mehrfachauswahl möglich.', type:'multi',
    opts:[{v:'solo',l:'Solo'},{v:'paar',l:'Paar'},{v:'familie',l:'Familie'},{v:'angehoerige',l:'Mit zu betreuenden Angehörigen'}] },
  { id:'f2', q:'Kommen Kinder mit – und wenn ja, wie alt sind sie?', hint:'Mehrfachauswahl möglich.', type:'multi',
    opts:[{v:'keine',l:'Keine Kinder'},{v:'unter6',l:'Unter 6 Jahre'},{v:'sechs10',l:'6–10 Jahre'},{v:'zehn16',l:'10–16 Jahre'},{v:'ueber16',l:'Über 16 Jahre'}] },
  { id:'f3', q:'Wie lange willst du Deutschland hinter dir lassen?', type:'single',
    opts:[{v:'unter6m',l:'Unter 6 Monate'},{v:'sechs12m',l:'6–12 Monate'},{v:'laenger1j',l:'Länger als 1 Jahr'},{v:'dauerhaft',l:'Dauerhaft'},{v:'offen',l:'Noch offen'}] },
  { id:'f4', q:'Habt ihr schon ein Zielland?', type:'single',
    opts:[{v:'fest',l:'Festes Zielland'},{v:'mehrere',l:'Mehrere im Blick'},{v:'bewegung',l:'Wir bleiben in Bewegung (ohne festen Wohnsitz)'},{v:'offen',l:'Noch komplett offen'}] },
  { id:'f5', q:'Wie wohnst du gerade in Deutschland?', type:'single',
    opts:[{v:'miete',l:'Mietwohnung oder Miethaus'},{v:'eigentum',l:'Eigentum (selbst genutzt)'},{v:'familie',l:'Bei Familie oder Partner'},{v:'keiner',l:'Kein eigener Wohnsitz'}] },
  { id:'f6', q:'Wie ist deine berufliche Situation?', hint:'Mehrfachauswahl möglich.', type:'multi',
    opts:[{v:'angestellt',l:'Angestellt'},{v:'selbst',l:'Selbstständig'},{v:'freiberuf',l:'Freiberuflich'},{v:'unternehmer',l:'Unternehmer mit eigener Firma'},{v:'beamter',l:'Beamter/Beamtin'},{v:'rentner',l:'Rentner/in'},{v:'studium',l:'Studium oder Ausbildung'},{v:'ohne',l:'Ohne Einkommen'},{v:'ksk',l:'Künstlersozialkasse'},{v:'elternzeit',l:'Elternzeit'}] },
  { id:'f7', q:'Besitzt du in Deutschland eine oder mehrere Immobilien?', type:'single',
    opts:[{v:'ja',l:'Ja'},{v:'nein',l:'Nein'}] },
  { id:'f8', q:'Ist in Deutschland ein Fahrzeug auf dich angemeldet?\n(Auto, Motorrad, Wohnmobil, Anhänger)', type:'single',
    opts:[{v:'ja',l:'Ja'},{v:'nein',l:'Nein'}] },
  { id:'f9', q:'Bist du Mitglied einer Kirche?', type:'single',
    opts:[{v:'ja',l:'Ja'},{v:'nein',l:'Nein'}] },
  { id:'f10', q:'Kommt ein Haustier mit?', type:'single',
    opts:[{v:'ja',l:'Ja'},{v:'nein',l:'Nein'}] },
  { id:'f11', q:'Hast du in Deutschland laufende Kredite oder Schulden?', type:'single',
    opts:[{v:'ja',l:'Ja'},{v:'nein',l:'Nein'}] },
  { id:'f12', q:'Hast du Wertpapiere, Fonds, Krypto oder andere nennenswerte Investments?', type:'single',
    opts:[{v:'ja',l:'Ja'},{v:'nein',l:'Nein'}] },
  { id:'f13', q:'Bist du an einer Firma beteiligt?\n(GmbH, AG, UG, Limited oder Ähnliches – in Deutschland oder im Ausland)', type:'single',
    opts:[{v:'ja',l:'Ja'},{v:'nein',l:'Nein'}] },
  { id:'f14', q:'Wird nach dem Wegzug noch Geld aus deutschen Quellen zu dir fließen?\n(Lohn, Miete, Rente, Honorare, Gewinnausschüttungen)', type:'single',
    opts:[{v:'ja',l:'Ja'},{v:'nein',l:'Nein'},{v:'unklar',l:'Noch unklar'}] },
  { id:'f15', q:'Gibt es familienrechtliche Themen, die wir mitdenken sollten?\n(geteiltes Sorgerecht, laufende Verfahren, Mitspracherechte)', type:'single',
    opts:[{v:'ja',l:'Ja'},{v:'nein',l:'Nein'}] },
  { id:'f16', q:'Steht bei dir eine Erbschaft oder Schenkung an oder bist du bereits begünstigt?', type:'single',
    opts:[{v:'ja',l:'Ja'},{v:'nein',l:'Nein'},{v:'unklar',l:'Noch unklar'}] },
  { id:'f17', q:'Bist du in Deutschland für die Pflege oder Betreuung einer anderen Person verantwortlich?', type:'single',
    opts:[{v:'ja',l:'Ja'},{v:'nein',l:'Nein'}] }
];

// ============================================================
// PHASE 2 TOPICS
// ============================================================
// type: 'op'=operative, 'dec'=decision
// sel: 'single'|'multi' (operative only)
// trigger(s): function returning bool
// opts: [{v, l, todo, cl}]  cl=checklist label
// trl: TRL-Angebot text or null

const TOPICS = [
  // --- 1. PÄSSE, AUSWEISE ---
  { id:'t30', sec:1, name:'Pässe und Ausweisdokumente', type:'op', sel:'multi',
    trigger: s => true,
    q: 'Wie sieht es bei dir mit den Ausweisdokumenten aus? Wähle alles, was zutrifft.',
    opts: [
      { v:'aktuell',    l:'Alle Dokumente sind aktuell und noch lange gültig.', todo: null, cl: null },
      { v:'reisepass',  l:'Mein Reisepass läuft demnächst ab.',           todo:'Reisepass rechtzeitig vor dem Wegzug verlängern (10 Jahre Gültigkeit anstreben).',  cl:'Reisepass verlängern' },
      { v:'ausweis',    l:'Mein Personalausweis läuft demnächst ab.',      todo:'Personalausweis rechtzeitig erneuern.',                                             cl:'Personalausweis erneuern' },
      { v:'kinderpass', l:'Ein Kinderpass läuft ab oder fehlt.',           todo:'Kinderausweisdokumente prüfen und neu beantragen.',                                 cl:'Kinderpässe erneuern' },
      { v:'passbilder', l:'Mir fehlen aktuelle biometrische Passbilder.',   todo:'Biometrische Passbilder für alle Familienmitglieder anfertigen lassen.',           cl:'Biometrische Passbilder' },
      { v:'ungeprueft', l:'Noch nicht geprüft.',                           todo:'Gültigkeit aller Ausweisdokumente prüfen und bei Bedarf erneuern.',                cl:'Ausweisdokumente prüfen' }
    ], trl: null },

  { id:'t31', sec:1, name:'Führerschein', type:'op', sel:'single',
    trigger: s => true,
    q: 'Wie soll dein Führerschein-Setup für die Zeit im Ausland aussehen?',
    opts: [
      { v:'int',     l:'Ich will einen internationalen Führerschein dabei haben.',       todo:'Internationalen Führerschein vor dem Wegzug beantragen (gilt 3 Jahre).',                                                      cl:'Internationaler Führerschein' },
      { v:'umschreib',l:'Ich will den Führerschein im Zielland umschreiben lassen.',    todo:'Voraussetzungen im Zielland prüfen und Führerschein bei Bedarf übersetzen oder beglaubigen lassen.',                          cl:'Führerschein umschreiben' },
      { v:'deutsch', l:'Mein deutscher Führerschein reicht mir.',                       todo:'Anerkennung des deutschen Führerscheins im Zielland prüfen und Übersetzung bei Bedarf mitführen.',                            cl:'Führerschein-Anerkennung prüfen' },
      { v:'unklar',  l:'Noch unklar.',                                                  todo:'BERATUNGSTHEMA', cl:'Führerschein' }
    ], trl: null },

  { id:'t32', sec:1, name:'Sonstige Dokumente', type:'op', sel:'multi',
    trigger: s => true,
    q: 'Welche dieser Dokumente brauchst du voraussichtlich? Wähle alles aus, was relevant ist.',
    opts: [
      { v:'geburt',   l:'(Internationale) Geburtsurkunde',           todo:'Internationale Geburtsurkunde besorgen, bei Bedarf mit Apostille.',                                    cl:'Geburtsurkunde mit Apostille' },
      { v:'heirat',   l:'Heiratsurkunde oder Scheidungsurteil',      todo:'Dokument besorgen, bei Bedarf übersetzen und legalisieren lassen.',                                    cl:'Heirats-/Scheidungsurkunde' },
      { v:'fuehrung', l:'Polizeiliches Führungszeugnis',             todo:'Führungszeugnis beantragen (für viele Behörden maximal 6 Monate alt).',                                cl:'Führungszeugnis beantragen' },
      { v:'vollmacht',l:'Vollmachten (Gesundheit, Pass, Reise)',     todo:'Vollmachten aufsetzen und bei Bedarf notariell beglaubigen lassen.',                                   cl:'Vollmachten aufsetzen' },
      { v:'beratung', l:'In der Beratung besprechen.',               todo:'BERATUNGSTHEMA', cl:'Sonstige Dokumente' },
      { v:'nichts',   l:'Brauche aktuell nichts davon.',             todo: null, cl: null }
    ], trl: null },

  // --- 2. ZIELLAND ---
  { id:'t33', sec:2, name:'Aufenthaltsgenehmigung und Visum', type:'op', sel:'single',
    trigger: s => s.f4 !== 'bewegung',
    q: 'Welche Aufenthaltsform habt ihr im Zielland im Sinn?',
    opts: [
      { v:'tourist',  l:'Touristenstatus (visafrei oder kurzes Visum)',                      todo:'Einreisebestimmungen prüfen und maximale Aufenthaltsdauer im Blick behalten.',                                                cl:'Einreisebedingungen prüfen' },
      { v:'befristet',l:'Befristete Aufenthaltsgenehmigung (z.B. Arbeit, Studium, Investor)', todo:'Visa-Antrag im Zielland recherchieren und Unterlagen vorbereiten.',                                                         cl:'Visaantrag vorbereiten' },
      { v:'dauerhaft',l:'Dauerhafte Aufenthaltsgenehmigung',                                 todo:'Anforderungen für dauerhaften Aufenthalt klären und Antragsprozess einleiten.',                                             cl:'Dauerhafter Aufenthalt beantragen' },
      { v:'heirat',   l:'Aufenthalt durch Heirat oder Geburt eines Kindes im Zielland',      todo:'Dokumente vorbereiten und Antragsprozess im Zielland einleiten.',                                                          cl:'Aufenthalt durch Familienrecht' },
      { v:'unklar',   l:'Noch unklar.',                                                       todo:'BERATUNGSTHEMA', cl:'Aufenthaltsgenehmigung' }
    ], trl:'Für eine Aufenthaltsgenehmigung oder die Gründung eines Compliance-Wohnsitzes im Ausland haben wir Partner vor Ort, die wir dir empfehlen können.' },

  { id:'t34', sec:2, name:'Zweite Staatsbürgerschaft', type:'op', sel:'single',
    trigger: s => true,
    q: 'Wie ist deine Situation beim Thema „Zweite Staatsbürgerschaft"?',
    opts: [
      { v:'mehr',     l:'Dazu möchte ich mehr erfahren.',  todo:'BERATUNGSTHEMA', cl:'Zweite Staatsbürgerschaft' },
      { v:'geklaert', l:'Ist geklärt.',                    todo: null, cl: null },
      { v:'keinthema',l:'Ist aktuell kein Thema.',         todo: null, cl: null }
    ],
    trl:'Zur zweiten Staatsbürgerschaft haben wir bei TRL ein konkretes Angebot.' },

  // --- 3. KINDER / SCHULE ---
  { id:'t25', sec:3, name:'Bildungsweg der Kinder', type:'op', sel:'multi',
    trigger: s => !s.f2.includes('keine') && s.f2.length > 0,
    q: 'Welcher Bildungsweg ist für eure Kinder im Ausland angedacht? Wähle alles aus, was passt – auch verschiedene Wege pro Kind.',
    opts: [

// ============================================================
// LOGIC
// ============================================================
function computeTriggered() {
  return TOPICS.filter(t => t.trigger(S)).map(t => t.id);
}

function getTopicAnswer(tid) {
  return S.p2[tid];
}

function buildResultItems() {
  // Returns [{secId, topicName, todos:[], checklistLabels:[], trlAngebot}]
  const items = [];
  for (const tid of p2Topics) {
    const topic = TOPICS.find(t => t.id === tid);
    const ans = S.p2[tid];
    if (!ans) continue;

    const todos = [];
    const checkItems = [];
    let trlText = topic.trl || null;

    if (topic.type === 'dec') {
      if (ans === 'nein') {
        const name = topic.decName || topic.name;
        todos.push(`Thema „${name}" steht noch aus → Beratungsthema.`);
        checkItems.push(`Beratungsthema: ${name}`);
      }
    } else {
      const selected = Array.isArray(ans) ? ans : [ans];
      for (const v of selected) {
        const opt = topic.opts.find(o => o.v === v);
        if (!opt) continue;
        if (!opt.todo) continue;
        if (opt.todo === 'BERATUNGSTHEMA') {
          todos.push(`Thema „${topic.name}" steht noch aus → Beratungsthema.`);
          checkItems.push(`Beratungsthema: ${topic.name}`);
        } else {
          todos.push(opt.todo);
          if (opt.cl) checkItems.push(opt.cl);
          // per-option TRL hint
          if (opt.trlInline && !trlText) trlText = opt.trlInline;
        }
      }
    }

    if (todos.length > 0) {
      items.push({ secId: topic.sec, topicName: topic.name, todos, checkItems, trlText });
    }
  }
  return items;
}

function generateDocText() {
  const items = buildResultItems();
  const vorname = S.vorname;

  // Summary line
  const f1Label = { solo:'Solo', paar:'Paar', familie:'Familie', angehoerige:'Mit Angehörigen' };
  const f3Label = { unter6m:'unter 6 Monate', sechs12m:'6–12 Monate', laenger1j:'länger als 1 Jahr', dauerhaft:'dauerhaft', offen:'noch offen' };
  const f4Label = { fest:'Festes Zielland', mehrere:'Mehrere im Blick', bewegung:'Unterwegs bleiben', offen:'Noch offen' };
  const wer = S.f1.map(v => f1Label[v] || v).join(', ') || '–';
  const dauer = f3Label[S.f3] || '–';
  const ziel = f4Label[S.f4] || '–';

  let doc = `# Auswander-Check – Dein persönliches Ergebnis
## Tabula Rasa Life | Lebenslang Frei

**Hallo ${vorname},**

vielen Dank für die Beantwortung der Fragen. Hier ist dein individuelles Ergebnis – dein persönlicher Fahrplan für unser Beratungsgespräch.

---

**Wer:** ${wer} | **Zeitplan:** ${dauer} | **Zielland:** ${ziel}

---

`;

  // Group by section
  const bySec = {};
  for (const item of items) {
    if (!bySec[item.secId]) bySec[item.secId] = [];
    bySec[item.secId].push(item);
  }

  for (const secId of Object.keys(bySec).sort((a,b)=>+a-+b)) {
    doc += `## ${SECTIONS[secId]}\n\n`;
    for (const item of bySec[secId]) {
      doc += `**${item.topicName}**\n`;
      for (const todo of item.todos) {
        doc += `${todo}\n`;
      }
      if (item.trlText) {
        doc += `\n> 🟠 **TRL-Angebot:** ${item.trlText}\n`;
      }
      doc += '\n';
    }
    doc += '---\n\n';
  }

  // Checklist – kompakt für eine Gamma-Karte
  const allChecks = items.flatMap(i => i.checkItems);
  if (allChecks.length > 0) {
    doc += '## Deine Checkliste – alles auf einen Blick\n\n';
    doc += '_Hak einfach ab, was du schon erledigt hast. Diese Liste passt komplett auf eine Karte – keine Aufteilung nötig._\n\n';
    for (const cl of allChecks) {
      doc += `- [ ] ${cl}\n`;
    }
    doc += '\n---\n\n';
  }

  doc += `## Dein nächster Schritt

Wir freuen uns auf das Gespräch mit dir. Bring dieses Dokument gern zu deinem Termin mit – ausgedruckt oder auf dem Handy.

**[Hier geht es zu deinem Beratungstermin](${CFG.calendly})**

**Kirstin und Martin**
Tabula Rasa Life – Lebenslang Frei
tabula-rasa.life`;

  return doc;
}

// ============================================================
// WEBHOOK (Make / Zapier)
// ============================================================
async function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function sendToWebhook() {
  if (!CFG.webhookUrl) throw new Error('Kein Webhook eingerichtet. Bitte beratung@tabula-rasa.life kontaktieren.');

  const text = generateDocText();
  // Wichtig: Content-Type 'text/plain' verwenden, damit Browser KEIN CORS-Preflight schickt.
  // Zapier parst den Body trotzdem als JSON. (Alternative: 'application/x-www-form-urlencoded')
  const res = await fetch(CFG.webhookUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
    body: JSON.stringify({
      vorname:       S.vorname,
      nachname:      S.nachname,
      email:         S.email,
      trl_email:     CFG.trlEmail,
      gamma_theme:   CFG.gammaThemeId,
      document_text: text
    })
  });
  if (!res.ok) throw new Error(`Webhook Fehler ${res.status}`);
}

// PERSISTENCE
// ============================================================
function saveProgress() {
  if (!S.email) return;
  localStorage.setItem(`ac-${S.email}`, JSON.stringify({ S, p1Step, p2Topics, p2Step, screen }));
}

function loadProgress(email) {
  try {
    const raw = localStorage.getItem(`ac-${email}`);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function clearProgress() {
  if (S.email) localStorage.removeItem(`ac-${S.email}`);
}

// --- PHASE 1 ---
function renderPhase1() {
  const q = P1[p1Step];
  const val = S[q.id];
  const pct = Math.round(((p1Step) / 17) * 50); // phase 1 = 0-50%

  app.innerHTML = header() +
    progressBar(pct, 'Phase 1 – Deine Lebenssituation', `Frage ${p1Step+1} von 17`) +
    `<div class="body">
      <div class="phase-label">Phase 1 – Deine Lebenssituation</div>
      <p class="question">${q.q.replace(/\n/g,'<br>')}</p>
      ${q.hint ? `<p class="question-hint">${q.hint}</p>` : ''}
      <div class="options" id="opts">
        ${q.opts.map(o => {
          const sel = q.type==='multi' ? (val||[]).includes(o.v) : val===o.v;
          return `<div class="opt ${q.type==='multi'?'multi':''} ${sel?'selected':''}" data-v="${o.v}">${
            q.type==='multi'
              ? `<span class="opt-dot"></span><span>${o.l}</span>`
              : `<span class="opt-dot"></span><span>${o.l}</span>`
          }</div>`;
        }).join('')}
      </div>
      <div class="nav">
        ${p1Step > 0 ? '<button class="btn btn-back" id="back">← Zurück</button>' : ''}
        ${q.type==='multi' ? '<button class="btn btn-primary" id="next" disabled>Weiter →</button>' : ''}
      </div>
    </div>`;

  // Option click
  document.getElementById('opts').addEventListener('click', e => {
    const el = e.target.closest('.opt');
    if (!el) return;
    const v = el.dataset.v;
    if (q.type === 'multi') {
      S[q.id] = S[q.id] || [];
      const idx = S[q.id].indexOf(v);
      if (idx >= 0) S[q.id].splice(idx, 1); else S[q.id].push(v);
      document.querySelectorAll('.opt').forEach(o => {
        o.classList.toggle('selected', S[q.id].includes(o.dataset.v));
      });
      const btn = document.getElementById('next');
      if (btn) btn.disabled = S[q.id].length === 0;
    } else {
      S[q.id] = v;
      saveProgress();
      setTimeout(advanceP1, 180);
    }
  });

  const nextBtn = document.getElementById('next');
  if (nextBtn) {
    nextBtn.disabled = !(S[q.id] && S[q.id].length > 0);
    nextBtn.onclick = () => { saveProgress(); advanceP1(); };
  }

  const backBtn = document.getElementById('back');
  if (backBtn) backBtn.onclick = () => {
    p1Step--; saveProgress(); render();
  };
}

function advanceP1() {
  p1Step++;
  if (p1Step >= 17) {
    p2Topics = computeTriggered();
    p2Step = 0;
    screen = 'transition';
  }
  saveProgress(); render();
}

// --- PHASE 2 ---
function renderPhase2() {
  const tid = p2Topics[p2Step];
  const topic = TOPICS.find(t => t.id === tid);
  const pct = Math.round(50 + (p2Step / p2Topics.length) * 45);

  let optsHtml = '';
  let isDec = topic.type === 'dec';
  const opts = isDec
    ? [{v:'ja',l:'Ja, ich habe mich damit bereits befasst.'},{v:'nein',l:'Nein, das steht noch aus.'}]
    : topic.opts;
  const isMul = !isDec && topic.sel === 'multi';
  const cur = S.p2[tid];

  optsHtml = opts.map(o => {
    const sel = isMul ? (Array.isArray(cur) && cur.includes(o.v)) : cur === o.v;
    return `<div class="opt ${isMul?'multi':''} ${sel?'selected':''}" data-v="${o.v}">
      <span class="opt-dot"></span><span>${o.l}</span>
    </div>`;
  }).join('');

  app.innerHTML = header() +
    progressBar(pct, 'Phase 2 – Themen-Check', `Thema ${p2Step+1} von ${p2Topics.length}`) +
    `<div class="body">
      <div class="phase-label">${topic.type==='dec'?'Entscheidungsthema':'Thema'} · ${SECTIONS[topic.sec]}</div>
      <p class="question">${topic.q}</p>
      <div class="options" id="opts">${optsHtml}</div>
      <div class="nav">
        <button class="btn btn-back" id="back">← Zurück</button>
        ${isMul ? '<button class="btn btn-primary" id="next" disabled>Weiter →</button>' : ''}
      </div>
    </div>`;

  document.getElementById('opts').addEventListener('click', e => {
    const el = e.target.closest('.opt');
    if (!el) return;
    const v = el.dataset.v;
    if (isMul) {
      S.p2[tid] = S.p2[tid] || [];
      const idx = S.p2[tid].indexOf(v);
      if (idx >= 0) S.p2[tid].splice(idx, 1); else S.p2[tid].push(v);
      document.querySelectorAll('.opt').forEach(o => {
        o.classList.toggle('selected', S.p2[tid].includes(o.dataset.v));
      });
      const btn = document.getElementById('next');
      if (btn) btn.disabled = S.p2[tid].length === 0;
    } else {
      S.p2[tid] = v;
      saveProgress();
      setTimeout(advanceP2, 180);
    }
  });

  const nextBtn = document.getElementById('next');
  if (nextBtn) {
    nextBtn.disabled = !(S.p2[tid] && S.p2[tid].length > 0);
    nextBtn.onclick = () => { saveProgress(); advanceP2(); };
  }

  document.getElementById('back').onclick = () => {
    if (p2Step > 0) { p2Step--; render(); }
    else { screen = 'transition'; render(); }
  };
}

function advanceP2() {
  p2Step++;
  if (p2Step >= p2Topics.length) {
    screen = 'submitting';
    statusStep = 0;
    render();
    startSubmit();

    render();

  const steps = ['Antworten werden verarbeitet …', 'Dein persönliches Dokument wird erstellt …', 'E-Mail wird versendet …'];
  app.innerHTML = header() +
    progressBar(97, 'Dein Ergebnis', 'Wird erstellt …') +

        <div class="spinner"></div>
        <h2>Gleich fertig, ${S.vorname}!</h2>
        <p>Wir erstellen gerade dein persönliches Auswander-Check-Ergebnis.</p>
        <div class="status-steps">
          ${steps.map((s,i) => `<div class="status-step ${i<statusStep?'done':i===statusStep?'active':''}" id="ss${i}">
            <span class="dot"></span><span>${s}</span>
          </div>`).join('')}
        </div>
      </div>
    </div>`;
}

function updateStatusStep(step) {
  statusStep = step;
  document.querySelectorAll('.status-step').forEach((el,i) => {
    el.className = 'status-step ' + (i < step ? 'done' : i === step ? 'active' : '');
  });
}

async function startSubmit() {
  try {
    updateStatusStep(0);
    await sleep(600);
    updateStatusStep(1);
    await sleep(400);
    updateStatusStep(2);
    await sendToWebhook();
    clearProgress();
    screen = 'result';
    render();
  } catch(err) {
    errorMsg = err.message;
    screen = 'error';
    render();
  }
}

// --- RESULT ---
function renderResult() {
  app.innerHTML = header() +
    progressBar(100, 'Fertig!', '✓') +
    `<div class="body">
      <div class="result-icon">🎉</div>
      <div class="result-box">
        <h2>Geschafft, ${S.vorname}!</h2>
        <p>Dein persönlicher Auswander-Check ist fertig. Du bekommst gleich eine E-Mail mit deinem Ergebnis-Dokument.</p>
      </div>
      <div class="gamma-link-wrap">
        <div class="email-confirm">
          <span>✓</span>
          <span>Dein Ergebnis-Dokument wird an <strong>${S.email}</strong> geschickt</span>
        </div>
        <div class="email-confirm" style="margin-top:8px">
          <span>✓</span>
          <span>Wir haben deine Antworten erhalten und bereiten uns auf euren Termin vor</span>
        </div>
      </div>
      <a class="btn-calendly" href="${CFG.calendly}" target="_blank" rel="noopener">
        Beratungstermin buchen →
      </a>
      <p class="calendly-sub">Bring dein Ergebnis-Dokument zum Termin mit – wir gehen alles gemeinsam durch.</p>
    </div>`;
}

// --- ERROR ---
function renderError() {
  app.innerHTML = header() +
    `<div class="body">
      <div class="error-box">
        <h3>Es gab ein technisches Problem</h3>
        <p>${errorMsg}</p>
      </div>
      <p style="font-size:.83rem;color:#555;margin-bottom:20px;font-weight:500;line-height:1.6">
        Bitte schreibe uns kurz an <strong>beratung@tabula-rasa.life</strong> – wir senden dir dein Ergebnis manuell zu.
      </p>
      <div class="nav">
        <button class="btn btn-back" id="retry">← Zurück zum Check</button>
        <a class="btn btn-primary" style="text-align:center;text-decoration:none" href="${CFG.calendly}" target="_blank">Termin buchen</a>
      </div>
    </div>`;
  document.getElementById('retry').onclick = () => {
    screen = 'phase2'; render();
  };
}

// ============================================================
// INIT
// ============================================================
render();
</script>
</body>
</html>
